# À installer dans /etc/nginx/sites-available/ei-mgp puis à adapter avec le domaine réel.
server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE;

    # La limite applicative est de 8 Mo. Une petite marge couvre le multipart.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pas de connexion persistante héritée du client vers le processus Node.
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
